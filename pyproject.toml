[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-dyepack"
version = "0.1.0"
description = "Dye packs for customer data: canary customers, honey encrypted exports and a speed alarm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dyepack = "dyepack.cli:main"

[tool.setuptools]
packages = ["dyepack"]

[tool.setuptools.package-data]
dyepack = ["web/*"]
